name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run prisma:generate -w apps/api
      - run: npm run build -w packages/shared
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
