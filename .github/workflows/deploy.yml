name: deploy

on:
  push:
    branches: [deploy]

env:
  MIKRUS_HOST: wiktor144.mikrus.xyz
  MIKRUS_PORT: 10144

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true
          cache: npm

      - run: npm ci
      - run: npm run prisma:generate -w apps/api
      - run: npm run build:shared
      - run: npm run build:api
      - name: Build web (same-origin API in production)
        run: npm run build:web
        env:
          VITE_API_URL: ''

      # The VPS kills a long `npm ci`, so the API's production dependencies are installed here
      # and shipped. The workspace manifests must all be present for the lockfile to validate.
      - name: Install API production dependencies
        run: |
          mkdir -p .deploy-deps/apps/api .deploy-deps/apps/web .deploy-deps/packages/shared
          cp package.json package-lock.json .deploy-deps/
          cp apps/api/package.json .deploy-deps/apps/api/
          cp apps/web/package.json .deploy-deps/apps/web/
          cp -r packages/shared/package.json packages/shared/dist .deploy-deps/packages/shared/
          cd .deploy-deps
          npm ci --omit=dev --no-audit --no-fund -w apps/api
          uname -m
          ldd --version | head -n 1
          openssl version

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MIKRUS_SSH_KEY }}

      - name: Trust host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ env.MIKRUS_PORT }} ${{ env.MIKRUS_HOST }} >> ~/.ssh/known_hosts

      # sharp and the Prisma migration engine ship native binaries for the runner's platform.
      - name: Check server platform matches the runner
        run: |
          ssh -p ${{ env.MIKRUS_PORT }} root@${{ env.MIKRUS_HOST }} '
            set -e
            uname -m
            ldd --version | head -n 1
            openssl version
            test "$(uname -m)" = x86_64
            ldd --version 2>&1 | grep -qiE "glibc|gnu libc"
            openssl version | grep -q "^OpenSSL 3\."
          '

      - name: Ship built files
        run: |
          rsync -az --delete \
            -e "ssh -p ${{ env.MIKRUS_PORT }}" \
            apps/web/dist/ root@${{ env.MIKRUS_HOST }}:/var/www/foka-vote/web/

          rsync -az --delete \
            --exclude uploads --exclude .env --exclude node_modules \
            -e "ssh -p ${{ env.MIKRUS_PORT }}" \
            apps/api/dist apps/api/package.json apps/api/prisma apps/api/prisma.config.ts \
            root@${{ env.MIKRUS_HOST }}:/var/www/foka-vote/apps/api/

          rsync -az --delete \
            -e "ssh -p ${{ env.MIKRUS_PORT }}" \
            packages/shared/dist packages/shared/package.json \
            root@${{ env.MIKRUS_HOST }}:/var/www/foka-vote/packages/shared/

          rsync -az \
            -e "ssh -p ${{ env.MIKRUS_PORT }}" \
            package.json package-lock.json tsconfig.base.json \
            root@${{ env.MIKRUS_HOST }}:/var/www/foka-vote/

          rsync -az --delete \
            -e "ssh -p ${{ env.MIKRUS_PORT }}" \
            .deploy-deps/node_modules/ root@${{ env.MIKRUS_HOST }}:/var/www/foka-vote/node_modules/

      - name: Migrate, restart
        run: |
          ssh -p ${{ env.MIKRUS_PORT }} root@${{ env.MIKRUS_HOST }} '
            set -e
            cd /var/www/foka-vote/apps/api
            npx prisma migrate deploy
            pm2 reload foka-api
          '
