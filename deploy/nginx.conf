# Production nginx config for the Mikrus VPS (/etc/nginx/sites-available/foka-vote).
# Not auto-synced by the deploy workflow — copy manually after editing and `nginx -t && systemctl reload nginx`.
#
# client_max_body_size must stay comfortably above the app's own upload ceiling
# (MAX_ARTWORK_FILE_SIZE_BYTES * the highest maxArtworksPerSubmission in use), or
# nginx rejects oversized requests with an opaque 413 before multer's proper
# per-file validation (and its clear error message) ever runs.

server {
    listen [::]:80;
    server_name _;

    client_max_body_size 100M;
    root /var/www/foka-vote/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /media/ {
        alias /var/www/foka-vote/apps/api/uploads/variants/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
