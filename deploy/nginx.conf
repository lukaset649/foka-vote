# Production nginx config for the Mikrus VPS (/etc/nginx/sites-available/foka-vote).
# Not auto-synced by the deploy workflow — copy manually after editing and `nginx -t && systemctl reload nginx`.
#
# client_max_body_size must stay comfortably above the largest request: one photo
# (MAX_ARTWORK_FILE_SIZE_BYTES in packages/shared/src/constants.ts, currently 25MB)
# plus multipart overhead. Otherwise nginx rejects it with an opaque 413 before
# multer's per-file validation (and its clear error message) ever runs.

server {
    listen [::]:80;
    server_name _;

    client_max_body_size 30M;
    root /var/www/foka-vote/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Headroom for processing a large photo on the small VPS; Cloudflare still cuts off at 100s.
        proxy_read_timeout 120s;
    }

    location /media/ {
        alias /var/www/foka-vote/apps/api/uploads/variants/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
