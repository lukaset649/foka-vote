services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foka_vote
      POSTGRES_USER: foka
      POSTGRES_PASSWORD: foka
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: sh -c "npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run dev:api"
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://foka:foka@db:5432/foka_vote?schema=public
      ADMIN_PASSWORD_HASH: placeholder-replace-after-step-13.2
      COOKIE_SECRET: 1849ff17de31b93f209ff9fa639e5df12fd367cda3e7778e346ebf2bea7319f2
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - api_prisma_client:/app/apps/api/node_modules/.prisma
    ports:
      - '3000:3000'
    depends_on:
      - db

  web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    command: npm run dev:web
    environment:
      NODE_ENV: development
      VITE_API_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    ports:
      - '5173:5173'
    depends_on:
      - api

volumes:
  db_data:
  api_node_modules:
  api_prisma_client:
  web_node_modules:
